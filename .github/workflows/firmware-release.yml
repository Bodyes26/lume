name: Lume Firmware Release

on:
  push:
    tags:
      - "fw-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (for example, 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            xphone-os/.pio/build
          key: ${{ runner.os }}-platformio-${{ hashFiles('xphone-os/platformio.ini') }}

      - name: Install PlatformIO 6.1.19
        run: python -m pip install platformio==6.1.19

      - name: Resolve release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${DISPATCH_VERSION}"
            RELEASE_TAG="fw-v${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build Lume for X3
        run: cd xphone-os && pio run -e lume-x3

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp xphone-os/.pio/build/lume-x3/firmware.bin dist/lume-x3.bin
          cp dist/lume-x3.bin "dist/lume-x3-${VERSION}.bin"
          # Pre-named for the SD updater so users skip the rename step.
          cp dist/lume-x3.bin dist/update.bin

          # Zip wrapper: a re-downloaded zip gets browser-renamed, but the
          # update.bin inside keeps its exact name.
          mkdir -p ziproot/lume-x3
          cp dist/lume-x3.bin ziproot/lume-x3/update.bin
          printf '%s\n' \
            'Lume - Xteink X3 firmware' \
            '' \
            '1. Copy update.bin to the root of the microSD card.' \
            '2. Put the card back in the X3.' \
            '3. Hold the left side button and power together until the' \
            '   update screen appears.' \
            > ziproot/lume-x3/README.txt
          (cd ziproot && zip -qr ../dist/lume-x3.zip lume-x3)

          (
            cd dist
            sha256sum \
              lume-x3.zip \
              update.bin \
              lume-x3.bin \
              "lume-x3-${VERSION}.bin" \
              > SHA256SUMS.txt
          )

          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "version": os.environ["VERSION"],
              "date": os.environ["RELEASE_DATE"],
              "assets": {
                  "x3": {
                      "file": "lume-x3.bin",
                      "sha256": sha256(dist / "lume-x3.bin"),
                  },
              },
          }

          (dist / "latest.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lume ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
