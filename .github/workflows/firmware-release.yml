name: Lume Firmware Release

on:
  push:
    tags:
      - "fw-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (for example, 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            xphone-os/.pio/build
          key: ${{ runner.os }}-platformio-${{ hashFiles('xphone-os/platformio.ini') }}

      - name: Install PlatformIO 6.1.19
        run: python -m pip install platformio==6.1.19

      - name: Resolve release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${DISPATCH_VERSION}"
            RELEASE_TAG="fw-v${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Run host tests
        run: cd xphone-os && sh test/host/run.sh

      - name: Build Italian and English Lume for X3
        run: cd xphone-os && pio run -e lume-x3-it -e lume-x3-en

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp xphone-os/.pio/build/lume-x3-it/firmware.bin dist/update_it.bin
          cp xphone-os/.pio/build/lume-x3-en/firmware.bin dist/update_en.bin
          cp dist/update_it.bin dist/lume-x3-it.bin
          cp dist/update_en.bin dist/lume-x3-en.bin
          cp dist/update_it.bin "dist/lume-x3-it-${VERSION}.bin"
          cp dist/update_en.bin "dist/lume-x3-en-${VERSION}.bin"

          # Each zip keeps the boot updater's required update.bin name while
          # its folder and archive make the selected locale unambiguous.
          for locale in it en; do
            mkdir -p "ziproot/lume-x3-${locale}"
            cp "dist/update_${locale}.bin" "ziproot/lume-x3-${locale}/update.bin"
            printf '%s\n' \
              "Lume - Xteink X3 firmware (${locale})" \
              '' \
              '1. Copy update.bin to the root of the microSD card.' \
              '2. Put the card back in the X3.' \
              '3. Hold the left side button and power together until the' \
              '   update screen appears.' \
              > "ziproot/lume-x3-${locale}/README.txt"
            (cd ziproot && zip -qr "../dist/lume-x3-${locale}.zip" "lume-x3-${locale}")
          done

          (
            cd dist
            sha256sum \
              lume-x3-it.zip \
              lume-x3-en.zip \
              update_it.bin \
              update_en.bin \
              lume-x3-it.bin \
              lume-x3-en.bin \
              "lume-x3-it-${VERSION}.bin" \
              "lume-x3-en-${VERSION}.bin" \
              > SHA256SUMS.txt
          )

          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "version": os.environ["VERSION"],
              "date": os.environ["RELEASE_DATE"],
              "assets": {
                  "x3": {
                      "defaultLocale": "it",
                      "locales": {
                          locale: {
                              "file": f"update_{locale}.bin",
                              "sha256": sha256(dist / f"update_{locale}.bin"),
                          }
                          for locale in ("it", "en")
                      },
                  },
              },
          }

          (dist / "latest.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lume ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
