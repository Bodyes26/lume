name: Lume CI

# Gate every push and pull request on what the release workflow would do first:
# host tests plus both locale builds (docs/lume/09-cose-da-sistemare.md, voce 41
# — until now a broken tree was only discovered when tagging a release).
# No artefacts and no release logic live here: firmware-release.yml stays the
# single place that packages and publishes binaries.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same rule as the release workflow: only the toolchain/library download
      # cache, never xphone-os/.pio/build, so a build always matches the commit.
      - name: Cache PlatformIO toolchain and libraries
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('xphone-os/platformio.ini') }}

      - name: Install PlatformIO 6.1.19
        run: python -m pip install platformio==6.1.19

      # Host tests first: they need no toolchain download, so a broken clock or
      # a missing translation fails in seconds instead of after the ESP32 build.
      - name: Run host tests
        run: cd xphone-os && sh test/host/run.sh

      # No -DXPHONE_VERSION here: CI checks that the tree compiles, the version
      # is injected only when a tag is released (firmware-release.yml).
      - name: Build Italian and English Lume for X3
        run: cd xphone-os && pio run -e lume-x3-it -e lume-x3-en
